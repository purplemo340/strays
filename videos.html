<div>
    <script src="https://apis.google.com/js/api.js"></script>
<script>
  /**
   * Sample JavaScript code for youtube.videos.list
   * See instructions for running APIs Explorer code samples locally:
   * https://developers.google.com/explorer-help/code-samples#javascript
   */

  function authenticate() {
    return gapi.auth2.getAuthInstance()
        .signIn({scope: "https://www.googleapis.com/auth/youtube https://www.googleapis.com/auth/youtube.force-ssl https://www.googleapis.com/auth/youtube.readonly https://www.googleapis.com/auth/youtubepartner"})
        .then(function() { console.log("Sign-in successful"); },
              function(err) { console.error("Error signing in", err); });
  }
  function loadClient() {
    gapi.client.setApiKey("AIzaSyCKc0lflKguS_ANoWlR8yvOqLi1WnBsXe0");
    return gapi.client.load("https://youtube.googleapis.com/$discovery/rest?version=v3")
        .then(function() { console.log("GAPI client loaded for API"); },
              function(err) { console.error("Error loading GAPI client for API", err); });
  }
  // Make sure the client is loaded and sign-in is complete before calling this method.
  function execute() {
    return youtube.videos.list({
      "part": [
        "snippet"
      ],
      "id": [
        "ovHoY8UBIu8"
      ]
    })
        .then(function(response) {
                // Handle the results here (response.result has the parsed body).
                console.log("Response", response);
                document.getElementById("test").innerHTML = "Response: " + response.result.items[0].snippet.title;
              },
              function(err) { console.error("Execute error", err); });
    
  }
  gapi.load("client:auth2", function() {
    gapi.auth2.init({client_id: "1000912085585-m8t0co96mmn93ublqnj55ef4tjd52gmo.apps.googleusercontent.com"});
  });
</script>
<h1 id="test">Info</h1>
<button onclick="authenticate().then(loadClient)">authorize and load</button>
<button onclick="execute()">execute</button>

</div>
